name: CI

# Org contract: lint → build → test on PR and main.
# Deploy stays in platform hooks / separate workflows on main.
on:
  pull_request:
  push:
    branches: ["main", "master"]

concurrency:
  group: aegisai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"
      - name: Install frontend
        run: npm --prefix apps/web ci
      - name: Frontend lint
        run: npm --prefix apps/web run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"
      - name: Install frontend
        run: npm --prefix apps/web ci
      - name: Frontend build
        run: npm --prefix apps/web run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: python -m pip install -r requirements.txt pytest
      - name: Backend tests
        run: python -m pytest -q

  ci-ok:
    name: CI gate
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + build + test
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
